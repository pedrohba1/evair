[project]
name = "evair"
version = "0.2.0"
description = "EVAIR - Emissor de NFS-e (Sistema Nacional NFS-e / Sefin Nacional) com agente LangGraph"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "cryptography>=42.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "xmlschema>=3.0",
]

[project.optional-dependencies]
# Etapa 2 (agente LangGraph) — extração estruturada + aprovação humana.
agent = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]
# Etapa 3 (servidor HTTP local sem estado).
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evair"]
