[project]
name = "evair"
version = "0.1.0"
description = "EVAIR - Emissor de NFS-e (Sistema Nacional NFS-e / Sefin Nacional) com agente LangGraph"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "cryptography>=42.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "xmlschema>=3.0",
]

[project.optional-dependencies]
# Etapa 2 (agente): descomentar quando for montar o LangGraph
# agent = ["langgraph>=0.2", "langchain>=0.3", "langchain-ollama>=0.2"]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evair"]
